<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEM 任务悬赏板</title>
<style>
body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;max-width:900px;margin:auto;padding:16px;background:#f6f7fb}
.card{background:#fff;border-radius:10px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0001}
input,button{padding:8px;margin:4px 0;font-size:14px}input{width:100%;box-sizing:border-box}
button{background:#f0b90b;border:0;border-radius:6px;cursor:pointer}button:hover{opacity:.85}
.muted{color:#777;font-size:13px}.burn{font-size:22px;color:#d33;font-weight:bold}
</style>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<script src="config.js"></script>
</head><body>
<h1>🔥 BEM 任务悬赏板</h1>
<div class="card"><button id="connect">连接钱包 (MetaMask)</button> <span id="acct" class="muted">未连接</span>
<div>累计销毁：<span id="burned" class="burn">-</span> BEM</div><div class="muted" id="bal"></div></div>
<div class="card"><h3>发布任务</h3>
<input id="amt" placeholder="悬赏金额 (BEM)"><input id="days" placeholder="截止天数，例如 7" value="7">
<input id="meta" placeholder="任务描述或链接 (IPFS / URL)">
<button id="create">授权并发布</button><div class="muted">发布时销毁 0.5%，支付时销毁 10%。审核窗口 3 天，超时工作者可自行领取。</div></div>
<h3>任务列表</h3><div id="list">加载中…</div>
<script>
const C=window.BEM_CONFIG, E=ethers;
const BOARD_ABI=["function taskCount() view returns(uint256)","function totalBurned() view returns(uint256)","function token() view returns(address)","function REVIEW_WINDOW() view returns(uint256)",
"function getTask(uint256) view returns(tuple(address poster,address worker,uint256 reward,uint64 deadline,uint64 submittedAt,uint8 status,string metadataURI,string submissionURI))",
"function createTask(uint256,uint64,string) returns(uint256)","function submit(uint256,string)","function approve(uint256)","function reject(uint256)","function claim(uint256)","function cancel(uint256)","function reclaim(uint256)"];
const ERC20=["function decimals() view returns(uint8)","function balanceOf(address) view returns(uint256)","function allowance(address,address) view returns(uint256)","function approve(address,uint256) returns(bool)"];
const ST=["-","进行中","待审核","已完成","已取消","已取回"];
let ro=new E.JsonRpcProvider(C.rpcUrl), signer=null, me=null, dec=8, tokenAddr;
const board=()=>new E.Contract(C.boardAddress,BOARD_ABI,signer||ro);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>E.formatUnits(v,dec);
async function init(){ tokenAddr=await board().token(); dec=Number(await new E.Contract(tokenAddr,ERC20,ro).decimals()); await refresh(); }
async function connect(){
  if(!window.ethereum) return alert("请安装 MetaMask");
  const hex="0x"+C.chainId.toString(16);
  try{await ethereum.request({method:"wallet_switchEthereumChain",params:[{chainId:hex}]});}
  catch(e){ if(e.code===4902) await ethereum.request({method:"wallet_addEthereumChain",params:[{chainId:hex,chainName:C.chainName,rpcUrls:[C.rpcUrl],nativeCurrency:{name:"BNB",symbol:"BNB",decimals:18},blockExplorerUrls:[C.explorer]}]}); else throw e;}
  const p=new E.BrowserProvider(window.ethereum); signer=await p.getSigner(); me=(await signer.getAddress()).toLowerCase();
  document.getElementById("acct").textContent=me; await refresh();
}
async function tx(f){ try{ const t=await f(); document.getElementById("acct").textContent="交易已发送，等待确认…"; await t.wait(); document.getElementById("acct").textContent=me; await refresh(); }catch(e){ alert("失败: "+(e.shortMessage||e.message)); } }
async function refresh(){
  const b=board(); document.getElementById("burned").textContent=fmt(await b.totalBurned());
  if(me) document.getElementById("bal").textContent="我的 BEM 余额："+fmt(await new E.Contract(tokenAddr,ERC20,ro).balanceOf(me));
  const n=Number(await b.taskCount()), rw=Number(await b.REVIEW_WINDOW()), now=Date.now()/1000; let h="";
  for(let i=n;i>=1&&i>n-50;i--){ const t=await b.getTask(i); const st=Number(t.status), poster=t.poster.toLowerCase(), worker=t.worker.toLowerCase(); let a="";
    if(me){
      if(st===1&&me!==poster&&now<=Number(t.deadline)) a+=`<input id="s${i}" placeholder="提交成果链接"><button onclick="act('submit',${i})">提交成果</button>`;
      if(st===1&&me===poster) a+=`<button onclick="act('cancel',${i})">取消并退款</button>`;
      if(st===1&&me===poster&&now>Number(t.deadline)) a+=`<button onclick="act('reclaim',${i})">取回资金</button>`;
      if(st===2&&me===poster) a+=`<button onclick="act('approve',${i})">批准并支付</button> <button onclick="act('reject',${i})">拒绝</button>`;
      if(st===2&&me===worker&&now>Number(t.submittedAt)+rw) a+=`<button onclick="act('claim',${i})">超时领取</button>`;
    }
    h+=`<div class="card"><b>#${i}</b> ${ST[st]} · 奖励 <b>${fmt(t.reward)}</b> BEM<div>${esc(t.metadataURI)}</div>
    <div class="muted">发布者 ${t.poster} · 截止 ${new Date(Number(t.deadline)*1000).toLocaleString()}</div>
    ${st>=2&&t.submissionURI?`<div class="muted">提交者 ${t.worker}：${esc(t.submissionURI)}</div>`:""}${a}</div>`; }
  document.getElementById("list").innerHTML=h||"暂无任务";
}
window.act=(m,i)=>{ if(!signer) return alert("请先连接钱包"); if(m==="submit"){const u=document.getElementById("s"+i).value; if(!u) return alert("请填写链接"); return tx(()=>board().submit(i,u));} tx(()=>board()[m](i)); };
document.getElementById("connect").onclick=connect;
document.getElementById("create").onclick=async()=>{
  if(!signer) return alert("请先连接钱包");
  const amt=E.parseUnits(document.getElementById("amt").value||"0",dec), d=Number(document.getElementById("days").value), meta=document.getElementById("meta").value;
  if(amt===0n||!meta||!(d>0)) return alert("请填写完整");
  const tk=new E.Contract(tokenAddr,ERC20,signer);
  if(await tk.allowance(me,C.boardAddress)<amt){ try{ await (await tk.approve(C.boardAddress,amt)).wait(); }catch(e){return alert("授权失败: "+(e.shortMessage||e.message));} }
  tx(()=>board().createTask(amt,BigInt(Math.floor(Date.now()/1000+d*86400)),meta));
};
init().catch(e=>document.getElementById("list").textContent="加载失败，请检查 config.js 中的合约地址/网络："+e.message);
</script></body></html>
